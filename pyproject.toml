[project]
name = "flomo-insight"
version = "0.1.0"
description = "AI-powered insight engine for flomo notes — all LLM-driven, no clustering"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AimTao", email = "net@aimto.net" }]
readme = "README.md"

dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "fastmcp>=2.0",
    "tomli-w>=1.0",
    "pydantic>=2.0",
]

[project.scripts]
flomo = "src.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "respx>=0.21",
]
